spring:
  ai:
    model:
      chat: none
    openai:
      api-key: ${OPENAI_API_KEY:}
  datasource:
    url: jdbc:mysql://localhost:${MYSQL_PORT:3307}/${MYSQL_DATABASE:recruit_agent}?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:recruit}
    password: ${MYSQL_PASSWORD:recruit}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: true
  elasticsearch:
    uris: http://localhost:${ELASTICSEARCH_PORT:9200}

logging:
  level:
    org.springframework.data.elasticsearch.client.WIRE: warn
    org.hibernate.SQL: debug

app:
  ocr:
    provider: paddle
    base-url: http://localhost:9001
    recognize-path: /api/ocr/recognize
    connect-timeout-ms: 10000
    read-timeout-ms: 180000
  embedding:
    provider: bge-m3
    base-url: http://localhost:9002
    embed-path: /api/embedding/embed
    connect-timeout-ms: 10000
    read-timeout-ms: 120000
    dimension: 1024
  resume:
    upload-dir: data/uploads/resumes
