spring:
  application:
    name: recruit-agent
  ai:
    model:
      chat: none
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:${OPENAI_API_KEY:}}
  datasource:
    url: jdbc:mysql://localhost:3307/recruit_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  elasticsearch:
    uris: http://localhost:9200

server:
  port: 8080

app:
  resume:
    upload-dir: data/uploads/resumes
